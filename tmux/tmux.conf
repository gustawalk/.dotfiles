# Ctrl+b is the main prefix. Ctrl+a remains a secondary prefix for Ctrl+a s.
set -g prefix C-b
set -g prefix2 C-a
bind C-b send-prefix
bind C-a send-prefix -2

set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm*:RGB,foot*:RGB,alacritty*:RGB,wezterm*:RGB'
set -g mouse on
set -g history-limit 50000
set -g focus-events on
set -g mode-keys vi
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
setw -g aggressive-resize on

# New panes and windows start in the active pane's directory.
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind t new-window -c '#{pane_current_path}'

# Move between panes without a prefix. Send the key to Neovim when it is active.
# The tmux format check is synchronous, unlike the previous ps command.
bind -n M-h if-shell -F '#{m/r:^(nvim|vim|gvim|view)$,#{pane_current_command}}' 'send-keys M-h' 'select-pane -L'
bind -n M-j if-shell -F '#{m/r:^(nvim|vim|gvim|view)$,#{pane_current_command}}' 'send-keys M-j' 'select-pane -D'
bind -n M-k if-shell -F '#{m/r:^(nvim|vim|gvim|view)$,#{pane_current_command}}' 'send-keys M-k' 'select-pane -U'
bind -n M-l if-shell -F '#{m/r:^(nvim|vim|gvim|view)$,#{pane_current_command}}' 'send-keys M-l' 'select-pane -R'
# Remove older direct Ctrl+h/j/k/l bindings when reloading a running server.
unbind -n C-h
unbind -n C-j
unbind -n C-k
unbind -n C-l
unbind -T copy-mode-vi C-h
unbind -T copy-mode-vi C-j
unbind -T copy-mode-vi C-k
unbind -T copy-mode-vi C-l
bind -T copy-mode-vi M-h select-pane -L
bind -T copy-mode-vi M-j select-pane -D
bind -T copy-mode-vi M-k select-pane -U
bind -T copy-mode-vi M-l select-pane -R

# Alt+Shift+h/j/k/l resizes the tmux pane directly, without a prefix.
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 3
bind -n M-K resize-pane -U 3
bind -n M-L resize-pane -R 5
bind -T copy-mode-vi M-H resize-pane -L 5
bind -T copy-mode-vi M-J resize-pane -D 3
bind -T copy-mode-vi M-K resize-pane -U 3
bind -T copy-mode-vi M-L resize-pane -R 5

# Prefix + h/j/k/l navigates. Uppercase swaps with the adjacent pane.
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H swap-pane -d -t '{left-of}'
bind -r J swap-pane -d -t '{down-of}'
bind -r K swap-pane -d -t '{up-of}'
bind -r L swap-pane -d -t '{right-of}'
# Reparent panes within the split layout. Uppercase H/J/K/L above only swap contents.
bind P switch-client -T pane-move \; display-message 'Move pane: h/j/k/l; q or Esc exits'
bind -T pane-move h run-shell '~/.config/tmux/scripts/move-pane-structural.sh left #{pane_id}' \; switch-client -T pane-move
bind -T pane-move j run-shell '~/.config/tmux/scripts/move-pane-structural.sh down #{pane_id}' \; switch-client -T pane-move
bind -T pane-move k run-shell '~/.config/tmux/scripts/move-pane-structural.sh up #{pane_id}' \; switch-client -T pane-move
bind -T pane-move l run-shell '~/.config/tmux/scripts/move-pane-structural.sh right #{pane_id}' \; switch-client -T pane-move
bind -T pane-move q switch-client -T root
bind -T pane-move Escape switch-client -T root
# Ctrl+arrow provides a resize fallback when the terminal does not send Alt+Shift.
bind -r C-Left resize-pane -L 5
bind -r C-Down resize-pane -D 3
bind -r C-Up resize-pane -U 3
bind -r C-Right resize-pane -R 5
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1
bind s choose-tree -Zs
bind w choose-tree
bind x confirm-before -p 'Close pane #P? (y/n)' kill-pane
bind X confirm-before -p 'Close window #I? (y/n)' kill-window
bind z resize-pane -Z
bind e select-layout tiled
bind R source-file ~/.config/tmux/tmux.conf \; display-message 'tmux config reloaded'

# Vim-style selection and a Wayland clipboard shortcut.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'

# Tokyo Night colors.
set -g status-position bottom
set -g status-interval 5
set -g status-style 'bg=#1a1b26,fg=#c0caf5'
set -g status-left-length 30
set -g status-right-length 60
set -g status-left '#[fg=#7aa2f7,bold] #S #[fg=#414868]│ #{?client_prefix,#[fg=#e0af68]●,#[fg=#565f89]●} #[fg=#414868]│ '
set -g status-right '#[fg=#7dcfff]#{b:pane_current_path} #[fg=#414868]│ #[fg=#bb9af7]%H:%M '
set -g window-status-format '#[fg=#a9b1d6] #I:#W '
set -g window-status-current-format '#[bg=#7aa2f7,fg=#1a1b26,bold] #I:#W '
set -g pane-border-style 'fg=#414868'
set -g pane-active-border-style 'fg=#7aa2f7'
set -g message-style 'bg=#7aa2f7,fg=#1a1b26'
set -g mode-style 'bg=#7aa2f7,fg=#1a1b26'

# Save and restore sessions, windows, pane layouts, and working directories.
# Keep this after the other bindings; tmux-resurrect adds prefix + Ctrl+s/r.
run-shell ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux
